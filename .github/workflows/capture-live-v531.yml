name: Capture Shattered Crown v531

# Recovery retriggered after local archive verification on 2026-09-02.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-live-v531.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery repository
        uses: actions/checkout@v4

      - name: Capture live deployment
        run: |
          rm -rf compiled-live-v531
          mkdir -p compiled-live-v531
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent             --domains shattered-crown-tactics.firekeeping.chatgpt.site             --directory-prefix=compiled-live-v531             https://shattered-crown-tactics.firekeeping.chatgpt.site/
          {
            echo "# Version 531 recovery manifest"
            echo
            echo "Source: https://shattered-crown-tactics.firekeeping.chatgpt.site"
            echo "Captured: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "This is compiled deployment output, not the missing clean TypeScript/React source."
          } > compiled-live-v531/RECOVERY_MANIFEST.md

      - name: Commit captured deployment
        run: |
          git config user.name "Shattered Crown Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add compiled-live-v531
          if git diff --cached --quiet; then
            echo "No recovery changes detected."
          else
            git commit -m "Back up compiled Shattered Crown v531 deployment"
            git push
          fi
